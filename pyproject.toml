[project]
name = "modernpackage"
authors = [
    {name = "Name Surname", email = "email@example.com"},
]
description = "Package configuration example using bleeding edge toolset."
readme = "README.md"
requires-python = ">= 3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = []

[project.urls]
homepage = "https://github.com/albertas/modernpackage"

[project.scripts]
modernpackage = "modernpackage.main:main"
mp = "modernpackage.main:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pip-audit",
    "deadcode",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "vupi>=0.0.7",
]

[tool.pytest.ini_options]
addopts = "--cov=modernpackage --no-cov-on-fail --cov-fail-under=95.0 -m 'not e2e'"
norecursedirs = ["backend_template", "frontend_template"]
markers = [
    "e2e: tests that perform real external calls (network/subprocess/fs)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["**/*.py", "backend_template/**", "frontend_template/**"]
exclude = ["tests/**", "frontend_template/node_modules/**", "frontend_template/dist/**"]

[tool.hatch.version]
path = "modernpackage/__init__.py"

[tool.ruff]  # https://docs.astral.sh/ruff/settings/
line-length = 88

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # one blank line before class
    "D213",    # multi line summary second line
    "COM812",  # missing trailing comma
    "ISC001",  # single line implicit string concatenation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "D", "PLR2004", "TRY003", "EM101"]  # allow assert, /tmp/ paths, no docs, magic values, inline exception messages in tests
"backend_template/**" = ["INP001", "I001"]  # template dirs: no __init__.py (INP001); isort can't detect first-party vs third-party without the generated package name (I001)
"frontend_template/**" = ["INP001"]  # Node project; no __init__.py, not a Python package
"backend_template/tests/*" = ["S101", "S108", "D100", "D103", "PLR2004", "TRY003", "EM101"]  # test rules; tests/* doesn't match this path prefix
"backend_template/migrations/*" = ["D103", "TC002"]  # migration env: no public function docstrings; Connection used at runtime

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
exclude = ["build", "dist", ".venv"]
python_version = "3.14"
strict = true
pretty = true
color_output = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true

[tool.deadcode]
ignore_names = [
    "main",
]
exclude = ["tests"]

[[tool.uv.index]]
name = "gitlab"
url = "https://gitlab.com/api/v4/projects/niekas%2Fpackages/packages/pypi/simple"
