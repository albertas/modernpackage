# task.yml
task: |
  When the scaffolder instantiates a new package, the operational/process
  artifacts — the `errors`, `issues`, and `workspace` directories plus the
  `lifecycle_state.yml` and `metrics.yml` files — must not be carried into the
  generated package. Extend the end-to-end test that inspects a freshly
  scaffolded package so it asserts these directories and files are absent, since
  they are currently still observed in newly created packages.
